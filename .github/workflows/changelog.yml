name: PR Changelogs
concurrency: commit_action
on:
  pull_request_target:
    types: [closed]

env:
  GITHUB_TOKEN: ${{ secrets.BOT_TOKEN || github.token }}
  CHANGELOG_DIR: ${{ vars.AMBERFALL_CHANGELOG_FILE || 'Resources/Changelog/AmberfallChangelog.yml' }}
  PR_NUMBER: ${{ github.event.number }}

jobs:
  changelog:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout changelog branch
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_TOKEN || github.token }}
          ref: ${{ vars.CHANGELOG_BRANCH || github.event.repository.default_branch }}

      - name: Setup Git
        env:
          CHANGELOG_USER: ${{ vars.CHANGELOG_USER || 'amberfall-changelog' }}
          CHANGELOG_EMAIL: ${{ vars.CHANGELOG_EMAIL || '41898282+github-actions[bot]@users.noreply.github.com' }}
        run: |
          git config user.name "${CHANGELOG_USER}"
          git config user.email "${CHANGELOG_EMAIL}"
        shell: bash

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.x

      - name: Install Dependencies
        working-directory: Tools/changelog
        run: npm install --ignore-scripts --no-package-lock
        shell: bash

      - name: Generate Changelog
        working-directory: Tools/changelog
        run: node changelog.js
        shell: bash

      - name: Commit Changelog
        env:
          CHANGELOG_BRANCH: ${{ vars.CHANGELOG_BRANCH || github.event.repository.default_branch }}
          CHANGELOG_MESSAGE: ${{ vars.CHANGELOG_MESSAGE || 'Automatic changelog update' }}
        run: |
          git add -- Resources/Changelog "${CHANGELOG_DIR}"
          if git diff --cached --quiet; then
            echo "Changelog unchanged."
            exit 0
          fi
          git commit -m "${CHANGELOG_MESSAGE} (PR ${PR_NUMBER})"
          git push origin "HEAD:${CHANGELOG_BRANCH}"
        shell: bash
