    sprite: _Amberfall/Mobs/Gnome/parts.rsi
  - type: VisualOrgan
    data:
      sprite: _Amberfall/Mobs/Gnome/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: Gnome

- type: entity
  parent: [ OrganBaseTorsoSexed, OrganBaseTorso, OrganGnomeExternal ]
