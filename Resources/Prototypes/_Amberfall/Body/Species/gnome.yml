    species: Gnome

- type: entity
  parent: [ AppearanceGnome, BaseSpeciesMobOrganic ]
  id: MobGnome
  name: Gnome
  components:
  - type: Butcherable
    spawned:
    - id: FoodMeatHuman
      amount: 5
    - id: MaterialBones1
      amount: 3

- type: entity
  parent: OrganHumanExternal
  id: OrganGnomeExternal
  abstract: true
  components:
