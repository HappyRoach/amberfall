
- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceGnome
  name: Gnome appearance
  categories: [ HideSpawnMenu ]
  components:
  - type: InitialBody
    organs:
      Torso: OrganGnomeTorso
      Head: OrganGnomeHead
      ArmLeft: OrganGnomeArmLeft
      ArmRight: OrganGnomeArmRight
      HandLeft: OrganGnomeHandLeft
      HandRight: OrganGnomeHandRight
      LegLeft: OrganGnomeLegLeft
      LegRight: OrganGnomeLegRight
      FootLeft: OrganGnomeFootLeft
      FootRight: OrganGnomeFootRight
      Eyes: OrganGnomeEyes
      Brain: OrganHumanBrain
      Tongue: OrganHumanTongue
