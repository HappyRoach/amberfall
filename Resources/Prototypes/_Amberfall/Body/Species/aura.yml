
- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceAuRa
  name: AuRa appearance
  categories: [ HideSpawnMenu ]
  components:
  - type: InitialBody
    organs:
      Torso: OrganAuRaTorso
      Head: OrganAuRaHead
      ArmLeft: OrganAuRaArmLeft
      ArmRight: OrganAuRaArmRight
      HandLeft: OrganAuRaHandLeft
      HandRight: OrganAuRaHandRight
      LegLeft: OrganAuRaLegLeft
      LegRight: OrganAuRaLegRight
      FootLeft: OrganAuRaFootLeft
      FootRight: OrganAuRaFootRight
      Tail: OrganAuRaTail
      Eyes: OrganAuRaEyes
      Brain: OrganHumanBrain
      Tongue: OrganHumanTongue
