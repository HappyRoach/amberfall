    layerOffsets:
      Hair: 0, 0.03125
      FacialHair: 0, 0.03125
      HeadSide: 0, 0.03125
      HeadTop: 0, 0.03125
      Snout: 0, 0.03125
      SnoutCover: 0, 0.03125
    femaleLayerOffsets:
      Hair: 0, -0.03125
      FacialHair: 0, -0.03125
      HeadSide: 0, -0.03125
      HeadTop: 0, -0.03125
      Snout: 0, -0.03125
      SnoutCover: 0, -0.03125
    hideableLayers:
