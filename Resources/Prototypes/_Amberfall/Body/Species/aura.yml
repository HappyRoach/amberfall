    species: AuRa

- type: entity
  parent: [ AppearanceAuRa, BaseSpeciesMobOrganic ]
  id: MobAuRa
  name: AuRa
  components:
  - type: Butcherable
    spawned:
    - id: FoodMeatHuman
      amount: 5
    - id: MaterialBones1
      amount: 3

- type: entity
  parent: OrganHumanExternal
  id: OrganAuRaExternal
  abstract: true
  components:
  - type: Sprite
    sprite: _Amberfall/Mobs/AuRa/parts.rsi
  - type: VisualOrgan
    data:
      sprite: _Amberfall/Mobs/AuRa/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: AuRa

- type: entity
  parent: [ OrganBaseTorsoSexed, OrganBaseTorso, OrganAuRaExternal ]
  id: OrganAuRaTorso
  components:
  - type: BodyPart
    slots: [ Head, ArmLeft, ArmRight, LegLeft, LegRight, Appendix, Lungs, Heart, Stomach, Liver, Kidneys, Tail ]

- type: entity
  parent: [ OrganBaseHeadSexed, OrganBaseHead, OrganAuRaExternal ]
  id: OrganAuRaHead
  components:
