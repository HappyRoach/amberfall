
- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceMurkling
  name: Murkling appearance
  categories: [ HideSpawnMenu ]
  components:
  - type: InitialBody
    organs:
      Torso: OrganMurklingTorso
      Head: OrganMurklingHead
      ArmLeft: OrganMurklingArmLeft
      ArmRight: OrganMurklingArmRight
      HandLeft: OrganMurklingHandLeft
      HandRight: OrganMurklingHandRight
      LegLeft: OrganMurklingLegLeft
      LegRight: OrganMurklingLegRight
      FootLeft: OrganMurklingFootLeft
      FootRight: OrganMurklingFootRight
      Tail: OrganMurklingTail
      Wings: OrganMurklingWings
      Eyes: OrganMurklingEyes
      Brain: OrganHumanBrain
      Tongue: OrganHumanTongue
      Appendix: OrganHumanAppendix
      Ears: OrganHumanEars
      Lungs: OrganHumanLungs
      Heart: OrganHumanHeart
      Stomach: OrganHumanStomach
      Liver: OrganHumanLiver
      Kidneys: OrganHumanKidneys
  - type: HumanoidProfile
    species: Murkling

- type: entity
  parent: [ AppearanceMurkling, BaseSpeciesMobOrganic ]
  id: MobMurkling
  name: Murkling
  components:
  - type: Butcherable
    spawned:
    - id: FoodMeatHuman
      amount: 5
    - id: MaterialBones1
      amount: 3

- type: entity
  parent: OrganHumanExternal
  id: OrganMurklingExternal
  abstract: true
  components:
  - type: Sprite
    sprite: _Amberfall/Mobs/Murkling/parts.rsi
  - type: VisualOrgan
    data:
      sprite: _Amberfall/Mobs/Murkling/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: Murkling

- type: entity
  parent: [ OrganBaseTorsoSexed, OrganBaseTorso, OrganMurklingExternal ]
  id: OrganMurklingTorso
  components:
  - type: BodyPart
    slots: [ Head, ArmLeft, ArmRight, LegLeft, LegRight, Appendix, Lungs, Heart, Stomach, Liver, Kidneys, Tail, Wings ]

- type: entity
  parent: [ OrganBaseHeadSexed, OrganBaseHead, OrganMurklingExternal ]
  id: OrganMurklingHead
  components:
  - type: VisualOrganMarkings
    layerOffsets:
      Hair: 0, 0.03125
      FacialHair: 0, 0.03125
      HeadSide: 0, 0.03125
      HeadTop: 0, 0.03125
      Snout: 0, 0.03125
      SnoutCover: 0, 0.03125
    femaleLayerOffsets:
      Hair: 0, -0.03125
      FacialHair: 0, -0.03125
      HeadSide: 0, -0.03125
      HeadTop: 0, -0.03125
      Snout: 0, -0.03125
      SnoutCover: 0, -0.03125
    hideableLayers:
    - enum.HumanoidVisualLayers.Hair
    - enum.HumanoidVisualLayers.FacialHair
    - enum.HumanoidVisualLayers.HeadSide
    - enum.HumanoidVisualLayers.HeadTop
    - enum.HumanoidVisualLayers.Snout
    - enum.HumanoidVisualLayers.SnoutCover

