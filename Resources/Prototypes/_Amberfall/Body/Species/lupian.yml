
- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceLupian
  name: Lupian appearance
  categories: [ HideSpawnMenu ]
  components:
  - type: InitialBody
    organs:
      Torso: OrganLupianTorso
      Head: OrganLupianHead
      ArmLeft: OrganLupianArmLeft
      ArmRight: OrganLupianArmRight
      HandLeft: OrganLupianHandLeft
      HandRight: OrganLupianHandRight
      LegLeft: OrganLupianLegLeft
      LegRight: OrganLupianLegRight
      FootLeft: OrganLupianFootLeft
      FootRight: OrganLupianFootRight
      Tail: OrganLupianTail
      Eyes: OrganLupianEyes
      Brain: OrganHumanBrain
      Tongue: OrganHumanTongue
      Appendix: OrganHumanAppendix
      Ears: OrganHumanEars
      Lungs: OrganHumanLungs
      Heart: OrganHumanHeart
      Stomach: OrganHumanStomach
      Liver: OrganHumanLiver
      Kidneys: OrganHumanKidneys
  - type: HumanoidProfile
    species: Lupian

- type: entity
  parent: [ AppearanceLupian, BaseSpeciesMobOrganic ]
  id: MobLupian
  name: Lupian
  components:
  - type: Butcherable
    spawned:
    - id: FoodMeatHuman
      amount: 5
    - id: MaterialBones1
      amount: 3

- type: entity
  parent: OrganHumanExternal
  id: OrganLupianExternal
  abstract: true
  components:
  - type: Sprite
    sprite: _Amberfall/Mobs/Lupian/parts.rsi
  - type: VisualOrgan
    data:
      sprite: _Amberfall/Mobs/Lupian/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: Lupian

- type: entity
  parent: [ OrganBaseTorsoSexed, OrganBaseTorso, OrganLupianExternal ]
  id: OrganLupianTorso
  components:
  - type: BodyPart
    slots: [ Head, ArmLeft, ArmRight, LegLeft, LegRight, Appendix, Lungs, Heart, Stomach, Liver, Kidneys, Tail ]

- type: entity
  parent: [ OrganBaseHeadSexed, OrganBaseHead, OrganLupianExternal ]
  id: OrganLupianHead
  components:
  - type: VisualOrganMarkings
    layerOffsets:
      Hair: 0, 0.03125
      FacialHair: 0, 0.03125
      HeadSide: 0, 0.03125
      HeadTop: 0, 0.03125
      Snout: 0, 0.03125
      SnoutCover: 0, 0.03125
    femaleLayerOffsets:
      Hair: 0, -0.03125
      FacialHair: 0, -0.03125
      HeadSide: 0, -0.03125
      HeadTop: 0, -0.03125
      Snout: 0, -0.03125
      SnoutCover: 0, -0.03125
    hideableLayers:
    - enum.HumanoidVisualLayers.Hair
    - enum.HumanoidVisualLayers.FacialHair
    - enum.HumanoidVisualLayers.HeadSide
    - enum.HumanoidVisualLayers.HeadTop
    - enum.HumanoidVisualLayers.Snout
    - enum.HumanoidVisualLayers.SnoutCover

- type: entity
  parent: [ OrganBaseArmLeft, OrganLupianExternal ]
  id: OrganLupianArmLeft
  components:
  - type: VisualOrgan
    sexStateOverrides:
      Male: l_arm
      Female: l_arm_f

- type: entity
  parent: [ OrganBaseArmRight, OrganLupianExternal ]
  id: OrganLupianArmRight
