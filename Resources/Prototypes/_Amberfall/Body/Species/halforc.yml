
- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceHalfOrc
  name: HalfOrc appearance
  categories: [ HideSpawnMenu ]
  components:
  - type: InitialBody
    organs:
      Torso: OrganHalfOrcTorso
      Head: OrganHalfOrcHead
      ArmLeft: OrganHalfOrcArmLeft
      ArmRight: OrganHalfOrcArmRight
      HandLeft: OrganHalfOrcHandLeft
      HandRight: OrganHalfOrcHandRight
      LegLeft: OrganHalfOrcLegLeft
      LegRight: OrganHalfOrcLegRight
      FootLeft: OrganHalfOrcFootLeft
      FootRight: OrganHalfOrcFootRight
      Eyes: OrganHalfOrcEyes
      Brain: OrganHumanBrain
      Tongue: OrganHumanTongue
      Appendix: OrganHumanAppendix
      Ears: OrganHumanEars
      Lungs: OrganHumanLungs
      Heart: OrganHumanHeart
      Stomach: OrganHumanStomach
      Liver: OrganHumanLiver
      Kidneys: OrganHumanKidneys
  - type: HumanoidProfile
    species: HalfOrc

- type: entity
  parent: [ AppearanceHalfOrc, BaseSpeciesMobOrganic ]
  id: MobHalfOrc
  name: HalfOrc
  components:
  - type: Butcherable
    spawned:
    - id: FoodMeatHuman
      amount: 5
    - id: MaterialBones1
      amount: 3

- type: entity
  parent: OrganHumanExternal
  id: OrganHalfOrcExternal
  abstract: true
  components:
  - type: Sprite
    sprite: _Amberfall/Mobs/HalfOrc/parts.rsi
  - type: VisualOrgan
    data:
      sprite: _Amberfall/Mobs/HalfOrc/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: HalfOrc

- type: entity
  parent: [ OrganBaseTorsoSexed, OrganBaseTorso, OrganHalfOrcExternal ]
  id: OrganHalfOrcTorso

- type: entity
  parent: [ OrganBaseHeadSexed, OrganBaseHead, OrganHalfOrcExternal ]
  id: OrganHalfOrcHead
  components:
  - type: VisualOrganMarkings
    layerOffsets:
      Hair: 0, 0.03125
      FacialHair: 0, 0.03125
      HeadSide: 0, 0.03125
      HeadTop: 0, 0.03125
      Snout: 0, 0.03125
      SnoutCover: 0, 0.03125
    femaleLayerOffsets:
      Hair: 0, 0.03125
      FacialHair: 0, 0.03125
      HeadSide: 0, 0.03125
      HeadTop: 0, 0.03125
      Snout: 0, 0.03125
      SnoutCover: 0, 0.03125
    hideableLayers:
    - enum.HumanoidVisualLayers.Hair
    - enum.HumanoidVisualLayers.FacialHair
    - enum.HumanoidVisualLayers.HeadSide
    - enum.HumanoidVisualLayers.HeadTop
    - enum.HumanoidVisualLayers.Snout
    - enum.HumanoidVisualLayers.SnoutCover

- type: entity
  parent: [ OrganBaseArmLeft, OrganHalfOrcExternal ]
  id: OrganHalfOrcArmLeft
  components:
