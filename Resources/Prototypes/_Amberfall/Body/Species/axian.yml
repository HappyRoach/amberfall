
- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceAxian
  name: Axian appearance
  categories: [ HideSpawnMenu ]
  components:
  - type: InitialBody
    organs:
      Torso: OrganAxianTorso
      Head: OrganAxianHead
      ArmLeft: OrganAxianArmLeft
      ArmRight: OrganAxianArmRight
      HandLeft: OrganAxianHandLeft
      HandRight: OrganAxianHandRight
      LegLeft: OrganAxianLegLeft
      LegRight: OrganAxianLegRight
      FootLeft: OrganAxianFootLeft
      FootRight: OrganAxianFootRight
      Tail: OrganAxianTail
      Eyes: OrganAxianEyes
      Brain: OrganHumanBrain
      Tongue: OrganHumanTongue
      Appendix: OrganHumanAppendix
      Ears: OrganHumanEars
      Lungs: OrganHumanLungs
      Heart: OrganHumanHeart
      Stomach: OrganHumanStomach
      Liver: OrganHumanLiver
      Kidneys: OrganHumanKidneys
  - type: HumanoidProfile
    species: Axian

- type: entity
  parent: [ AppearanceAxian, BaseSpeciesMobOrganic ]
  id: MobAxian
  name: Axian
  components:
  - type: Butcherable
    spawned:
    - id: FoodMeatHuman
      amount: 5
    - id: MaterialBones1
      amount: 3

- type: entity
  parent: OrganHumanExternal
  id: OrganAxianExternal
  abstract: true
  components:
  - type: Sprite
    sprite: _Amberfall/Mobs/Axian/parts.rsi
  - type: VisualOrgan
    data:
      sprite: _Amberfall/Mobs/Axian/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: Axian

- type: entity
  parent: [ OrganBaseTorsoSexed, OrganBaseTorso, OrganAxianExternal ]
  id: OrganAxianTorso
  components:
  - type: BodyPart
    slots: [ Head, ArmLeft, ArmRight, LegLeft, LegRight, Appendix, Lungs, Heart, Stomach, Liver, Kidneys, Tail ]

- type: entity
  parent: [ OrganBaseHeadSexed, OrganBaseHead, OrganAxianExternal ]
  id: OrganAxianHead
  components:
  - type: VisualOrganMarkings
    layerOffsets:
      Hair: 0, 0.03125
      FacialHair: 0, 0.03125
      HeadSide: 0, 0.03125
      HeadTop: 0, 0.03125
      Snout: 0, 0.03125
      SnoutCover: 0, 0.03125
    femaleLayerOffsets:
      Hair: 0, -0.03125
      FacialHair: 0, -0.03125
      HeadSide: 0, -0.03125
      HeadTop: 0, -0.03125
      Snout: 0, -0.03125
      SnoutCover: 0, -0.03125
    hideableLayers:
    - enum.HumanoidVisualLayers.Hair
    - enum.HumanoidVisualLayers.FacialHair
    - enum.HumanoidVisualLayers.HeadSide
    - enum.HumanoidVisualLayers.HeadTop
    - enum.HumanoidVisualLayers.Snout
    - enum.HumanoidVisualLayers.SnoutCover

