
- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceHalfElf
  name: HalfElf appearance
  categories: [ HideSpawnMenu ]
  components:
  - type: InitialBody
    organs:
      Torso: OrganHalfElfTorso
      Head: OrganHalfElfHead
      ArmLeft: OrganHalfElfArmLeft
      ArmRight: OrganHalfElfArmRight
      HandLeft: OrganHalfElfHandLeft
      HandRight: OrganHalfElfHandRight
      LegLeft: OrganHalfElfLegLeft
      LegRight: OrganHalfElfLegRight
      FootLeft: OrganHalfElfFootLeft
      FootRight: OrganHalfElfFootRight
      Eyes: OrganHalfElfEyes
      Brain: OrganHumanBrain
      Tongue: OrganHumanTongue
      Appendix: OrganHumanAppendix
      Ears: OrganHumanEars
      Lungs: OrganHumanLungs
      Heart: OrganHumanHeart
      Stomach: OrganHumanStomach
      Liver: OrganHumanLiver
      Kidneys: OrganHumanKidneys
  - type: HumanoidProfile
    species: HalfElf

- type: entity
  parent: [ AppearanceHalfElf, BaseSpeciesMobOrganic ]
  id: MobHalfElf
  name: HalfElf
  components:
  - type: Butcherable
    spawned:
    - id: FoodMeatHuman
      amount: 5
    - id: MaterialBones1
      amount: 3

- type: entity
  parent: OrganHumanExternal
  id: OrganHalfElfExternal
  abstract: true
  components:
  - type: Sprite
    sprite: _Amberfall/Mobs/HalfElf/parts.rsi
  - type: VisualOrgan
    data:
      sprite: _Amberfall/Mobs/HalfElf/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: HalfElf

- type: entity
  parent: [ OrganBaseTorsoSexed, OrganBaseTorso, OrganHalfElfExternal ]
  id: OrganHalfElfTorso

- type: entity
  parent: [ OrganBaseHeadSexed, OrganBaseHead, OrganHalfElfExternal ]
  id: OrganHalfElfHead
  components:
  - type: VisualOrganMarkings
    layerOffsets:
      Hair: 0, 0.03125
      FacialHair: 0, 0.03125
      HeadSide: 0, 0.03125
      HeadTop: 0, 0.03125
      Snout: 0, 0.03125
      SnoutCover: 0, 0.03125
    femaleLayerOffsets:
      Hair: 0, -0.03125
      FacialHair: 0, -0.03125
      HeadSide: 0, -0.03125
      HeadTop: 0, -0.03125
      Snout: 0, -0.03125
      SnoutCover: 0, -0.03125
    hideableLayers:
    - enum.HumanoidVisualLayers.Hair
    - enum.HumanoidVisualLayers.FacialHair
    - enum.HumanoidVisualLayers.HeadSide
    - enum.HumanoidVisualLayers.HeadTop
    - enum.HumanoidVisualLayers.Snout
    - enum.HumanoidVisualLayers.SnoutCover

