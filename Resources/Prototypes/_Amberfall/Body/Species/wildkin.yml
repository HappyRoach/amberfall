
- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceWildKin
  name: WildKin appearance
  categories: [ HideSpawnMenu ]
  components:
  - type: InitialBody
    organs:
      Torso: OrganWildKinTorso
      Head: OrganWildKinHead
      ArmLeft: OrganWildKinArmLeft
      ArmRight: OrganWildKinArmRight
      HandLeft: OrganWildKinHandLeft
      HandRight: OrganWildKinHandRight
      LegLeft: OrganWildKinLegLeft
      LegRight: OrganWildKinLegRight
      FootLeft: OrganWildKinFootLeft
      FootRight: OrganWildKinFootRight
      Tail: OrganWildKinTail
      Wings: OrganWildKinWings
      Eyes: OrganWildKinEyes
      Brain: OrganHumanBrain
      Tongue: OrganHumanTongue
      Appendix: OrganHumanAppendix
      Ears: OrganHumanEars
      Lungs: OrganHumanLungs
      Heart: OrganHumanHeart
      Stomach: OrganHumanStomach
      Liver: OrganHumanLiver
      Kidneys: OrganHumanKidneys
  - type: HumanoidProfile
    species: WildKin

- type: entity
  parent: [ AppearanceWildKin, BaseSpeciesMobOrganic ]
  id: MobWildKin
  name: WildKin
  components:
  - type: Butcherable
    spawned:
    - id: FoodMeatHuman
      amount: 5
    - id: MaterialBones1
      amount: 3

- type: entity
  parent: OrganHumanExternal
  id: OrganWildKinExternal
  abstract: true
  components:
  - type: Sprite
    sprite: _Amberfall/Mobs/WildKin/parts.rsi
  - type: VisualOrgan
    data:
      sprite: _Amberfall/Mobs/WildKin/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: WildKin

- type: entity
  parent: [ OrganBaseTorsoSexed, OrganBaseTorso, OrganWildKinExternal ]
  id: OrganWildKinTorso
  components:
  - type: BodyPart
    slots: [ Head, ArmLeft, ArmRight, LegLeft, LegRight, Appendix, Lungs, Heart, Stomach, Liver, Kidneys, Tail, Wings ]

- type: entity
  parent: [ OrganBaseHeadSexed, OrganBaseHead, OrganWildKinExternal ]
  id: OrganWildKinHead
  components:
  - type: VisualOrganMarkings
    layerOffsets:
      Hair: 0, 0.03125
      FacialHair: 0, 0.03125
      HeadSide: 0, 0.03125
      HeadTop: 0, 0.03125
      Snout: 0, 0.03125
      SnoutCover: 0, 0.03125
    femaleLayerOffsets:
      Hair: 0, -0.03125
      FacialHair: 0, -0.03125
      HeadSide: 0, -0.03125
      HeadTop: 0, -0.03125
      Snout: 0, -0.03125
      SnoutCover: 0, -0.03125
    hideableLayers:
    - enum.HumanoidVisualLayers.Hair
    - enum.HumanoidVisualLayers.FacialHair
    - enum.HumanoidVisualLayers.HeadSide
    - enum.HumanoidVisualLayers.HeadTop
    - enum.HumanoidVisualLayers.Snout
    - enum.HumanoidVisualLayers.SnoutCover

- type: entity
  parent: [ OrganBaseArmLeft, OrganWildKinExternal ]
  id: OrganWildKinArmLeft
  components:
  - type: VisualOrgan
    sexStateOverrides:
      Male: l_arm
      Female: l_arm_f

