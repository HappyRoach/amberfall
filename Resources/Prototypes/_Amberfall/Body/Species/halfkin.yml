
- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceHalfKin
  name: HalfKin appearance
  categories: [ HideSpawnMenu ]
  components:
  - type: InitialBody
    organs:
      Torso: OrganHalfKinTorso
      Head: OrganHalfKinHead
      ArmLeft: OrganHalfKinArmLeft
      ArmRight: OrganHalfKinArmRight
      HandLeft: OrganHalfKinHandLeft
      HandRight: OrganHalfKinHandRight
      LegLeft: OrganHalfKinLegLeft
      LegRight: OrganHalfKinLegRight
      FootLeft: OrganHalfKinFootLeft
      FootRight: OrganHalfKinFootRight
      Tail: OrganHalfKinTail
      Wings: OrganHalfKinWings
      Eyes: OrganHalfKinEyes
      Brain: OrganHumanBrain
      Tongue: OrganHumanTongue
      Appendix: OrganHumanAppendix
      Ears: OrganHumanEars
      Lungs: OrganHumanLungs
      Heart: OrganHumanHeart
      Stomach: OrganHumanStomach
      Liver: OrganHumanLiver
      Kidneys: OrganHumanKidneys
  - type: HumanoidProfile
    species: HalfKin

- type: entity
  parent: [ AppearanceHalfKin, BaseSpeciesMobOrganic ]
  id: MobHalfKin
  name: HalfKin
  components:
  - type: Butcherable
    spawned:
    - id: FoodMeatHuman
      amount: 5
    - id: MaterialBones1
      amount: 3

- type: entity
  parent: OrganHumanExternal
  id: OrganHalfKinExternal
  abstract: true
  components:
  - type: Sprite
    sprite: _Amberfall/Mobs/HalfKin/parts.rsi
  - type: VisualOrgan
    data:
      sprite: _Amberfall/Mobs/HalfKin/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: HalfKin

- type: entity
  parent: [ OrganBaseTorsoSexed, OrganBaseTorso, OrganHalfKinExternal ]
  id: OrganHalfKinTorso
  components:
  - type: BodyPart
    slots: [ Head, ArmLeft, ArmRight, LegLeft, LegRight, Appendix, Lungs, Heart, Stomach, Liver, Kidneys, Tail, Wings ]

- type: entity
  parent: [ OrganBaseHeadSexed, OrganBaseHead, OrganHalfKinExternal ]
  id: OrganHalfKinHead
  components:
  - type: VisualOrganMarkings
    layerOffsets:
      Hair: 0, 0.03125
      FacialHair: 0, 0.03125
      HeadSide: 0, 0.03125
      HeadTop: 0, 0.03125
      Snout: 0, 0.03125
      SnoutCover: 0, 0.03125
    femaleLayerOffsets:
      Hair: 0, -0.03125
      FacialHair: 0, -0.03125
      HeadSide: 0, -0.03125
      HeadTop: 0, -0.03125
      Snout: 0, -0.03125
      SnoutCover: 0, -0.03125
    hideableLayers:
    - enum.HumanoidVisualLayers.Hair
    - enum.HumanoidVisualLayers.FacialHair
    - enum.HumanoidVisualLayers.HeadSide
    - enum.HumanoidVisualLayers.HeadTop
    - enum.HumanoidVisualLayers.Snout
    - enum.HumanoidVisualLayers.SnoutCover

- type: entity
  parent: [ OrganBaseArmLeft, OrganHalfKinExternal ]
  id: OrganHalfKinArmLeft
  components:
  - type: VisualOrgan
    sexStateOverrides:
