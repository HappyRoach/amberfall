
- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceAasimar
  name: Aasimar appearance
  categories: [ HideSpawnMenu ]
  components:
  - type: InitialBody
    organs:
      Torso: OrganAasimarTorso
      Head: OrganAasimarHead
      ArmLeft: OrganAasimarArmLeft
      ArmRight: OrganAasimarArmRight
      HandLeft: OrganAasimarHandLeft
      HandRight: OrganAasimarHandRight
      LegLeft: OrganAasimarLegLeft
      LegRight: OrganAasimarLegRight
      FootLeft: OrganAasimarFootLeft
      FootRight: OrganAasimarFootRight
      Wings: OrganAasimarWings
      Eyes: OrganAasimarEyes
      Brain: OrganHumanBrain
      Tongue: OrganHumanTongue
      Appendix: OrganHumanAppendix
      Ears: OrganHumanEars
      Lungs: OrganHumanLungs
      Heart: OrganHumanHeart
      Stomach: OrganHumanStomach
      Liver: OrganHumanLiver
      Kidneys: OrganHumanKidneys
  - type: HumanoidProfile
    species: Aasimar

- type: entity
  parent: [ AppearanceAasimar, BaseSpeciesMobOrganic ]
  id: MobAasimar
  name: Aasimar
  components:
  - type: Butcherable
    spawned:
    - id: FoodMeatHuman
      amount: 5
    - id: MaterialBones1
      amount: 3

- type: entity
  parent: OrganHumanExternal
  id: OrganAasimarExternal
  abstract: true
  components:
  - type: Sprite
    sprite: _Amberfall/Mobs/Aasimar/parts.rsi
  - type: VisualOrgan
    data:
      sprite: _Amberfall/Mobs/Aasimar/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: Aasimar

- type: entity
  parent: [ OrganBaseTorsoSexed, OrganBaseTorso, OrganAasimarExternal ]
  id: OrganAasimarTorso
  components:
  - type: BodyPart
    slots: [ Head, ArmLeft, ArmRight, LegLeft, LegRight, Appendix, Lungs, Heart, Stomach, Liver, Kidneys, Wings ]

- type: entity
  parent: [ OrganBaseHeadSexed, OrganBaseHead, OrganAasimarExternal ]
  id: OrganAasimarHead
  components:
  - type: VisualOrganMarkings
    layerOffsets:
      Hair: 0, 0.03125
      FacialHair: 0, 0.03125
      HeadSide: 0, 0.03125
      HeadTop: 0, 0.03125
      Snout: 0, 0.03125
      SnoutCover: 0, 0.03125
    femaleLayerOffsets:
      Hair: 0, -0.03125
      FacialHair: 0, -0.03125
      HeadSide: 0, -0.03125
      HeadTop: 0, -0.03125
      Snout: 0, -0.03125
      SnoutCover: 0, -0.03125
    hideableLayers:
    - enum.HumanoidVisualLayers.Hair
    - enum.HumanoidVisualLayers.FacialHair
    - enum.HumanoidVisualLayers.HeadSide
    - enum.HumanoidVisualLayers.HeadTop
    - enum.HumanoidVisualLayers.Snout
    - enum.HumanoidVisualLayers.SnoutCover

- type: entity
  parent: [ OrganBaseArmLeft, OrganAasimarExternal ]
  id: OrganAasimarArmLeft
  components:
  - type: VisualOrgan
    sexStateOverrides:
      Male: l_arm
      Female: l_arm_f

- type: entity
  parent: [ OrganBaseArmRight, OrganAasimarExternal ]
  id: OrganAasimarArmRight
  components:
  - type: VisualOrgan
    sexStateOverrides:
      Male: r_arm
      Female: r_arm_f

- type: entity
  parent: [ OrganBaseHandLeft, OrganAasimarExternal ]
  id: OrganAasimarHandLeft
  components:
  - type: VisualOrgan
    sexStateOverrides:
      Male: l_hand
      Female: l_hand_f

- type: entity
  parent: [ OrganBaseHandRight, OrganAasimarExternal ]
  id: OrganAasimarHandRight
  components:
  - type: VisualOrgan
    sexStateOverrides:
      Male: r_hand
      Female: r_hand_f

- type: entity
  parent: [ OrganBaseLegLeft, OrganAasimarExternal ]
  id: OrganAasimarLegLeft
  components:
  - type: VisualOrgan
    sexStateOverrides:
      Male: l_leg
      Female: l_leg_f

- type: entity
  parent: [ OrganBaseLegRight, OrganAasimarExternal ]
  id: OrganAasimarLegRight
  components:
  - type: VisualOrgan
    sexStateOverrides:
      Male: r_leg
      Female: r_leg_f
    overlayLayer: rLegAbove
    overlayState: r_leg_above
    overlaySexStateOverrides:
      Female: r_leg_above_f

- type: entity
  parent: [ OrganBaseFootLeft, OrganAasimarExternal ]
  id: OrganAasimarFootLeft
  components:
  - type: VisualOrgan
    sexStateOverrides:
      Male: l_foot
      Female: l_foot_f

- type: entity
  parent: [ OrganBaseFootRight, OrganAasimarExternal ]
  id: OrganAasimarFootRight
  components:
  - type: VisualOrgan
    sexStateOverrides:
      Male: r_foot
      Female: r_foot_f

- type: entity
  parent: [ OrganBaseWings, OrganAasimarExternal ]
  id: OrganAasimarWings
  components:
  - type: VisualOrganMarkings
    layerOffsets:
      Wings: 0, 0.03125
    femaleLayerOffsets:
      Wings: 0, -0.03125
    hideableLayers: [ enum.HumanoidVisualLayers.Wings ]

- type: entity
  parent: OrganHumanEyes
  id: OrganAasimarEyes
  components:
  - type: VisualOrgan
    data:
      sprite: _Amberfall/Mobs/Aasimar/eyes.rsi
    sexStateOverrides:
      Male: eyes
      Female: eyes_f
