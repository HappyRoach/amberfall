
- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceKobold
  name: Kobold appearance
  categories: [ HideSpawnMenu ]
  components:
  - type: InitialBody
    organs:
      Torso: OrganKoboldTorso
      Head: OrganKoboldHead
      ArmLeft: OrganKoboldArmLeft
      ArmRight: OrganKoboldArmRight
      HandLeft: OrganKoboldHandLeft
      HandRight: OrganKoboldHandRight
      LegLeft: OrganKoboldLegLeft
      LegRight: OrganKoboldLegRight
      FootLeft: OrganKoboldFootLeft
      FootRight: OrganKoboldFootRight
      Eyes: OrganKoboldEyes
      Brain: OrganHumanBrain
      Tongue: OrganHumanTongue
      Appendix: OrganHumanAppendix
      Ears: OrganHumanEars
      Lungs: OrganHumanLungs
      Heart: OrganHumanHeart
      Stomach: OrganHumanStomach
      Liver: OrganHumanLiver
      Kidneys: OrganHumanKidneys
  - type: HumanoidProfile
    species: Kobold

- type: entity
  parent: [ AppearanceKobold, BaseSpeciesMobOrganic ]
  id: MobKobold
  name: Kobold
  components:
  - type: Butcherable
    spawned:
    - id: FoodMeatHuman
      amount: 5
    - id: MaterialBones1
      amount: 3

- type: entity
  parent: OrganHumanExternal
  id: OrganKoboldExternal
  abstract: true
  components:
  - type: Sprite
    sprite: _Amberfall/Mobs/Kobold/parts.rsi
  - type: VisualOrgan
    data:
      sprite: _Amberfall/Mobs/Kobold/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: KoboldMarkings

- type: entity
  parent: [ OrganBaseTorsoSexed, OrganBaseTorso, OrganKoboldExternal ]
  id: OrganKoboldTorso

- type: entity
  parent: [ OrganBaseHeadSexed, OrganBaseHead, OrganKoboldExternal ]
  id: OrganKoboldHead
  components:
  - type: VisualOrganMarkings
    layerOffsets:
      Hair: 0, -0.125
      FacialHair: 0, -0.125
      HeadSide: 0, -0.125
      HeadTop: 0, -0.125
      Snout: 0, -0.125
      SnoutCover: 0, -0.125
    femaleLayerOffsets:
      Hair: 0, -0.15625
      FacialHair: 0, -0.15625
      HeadSide: 0, -0.15625
      HeadTop: 0, -0.15625
      Snout: 0, -0.15625
      SnoutCover: 0, -0.15625
    hideableLayers:
    - enum.HumanoidVisualLayers.Hair
    - enum.HumanoidVisualLayers.FacialHair
    - enum.HumanoidVisualLayers.HeadSide
    - enum.HumanoidVisualLayers.HeadTop
    - enum.HumanoidVisualLayers.Snout
    - enum.HumanoidVisualLayers.SnoutCover

