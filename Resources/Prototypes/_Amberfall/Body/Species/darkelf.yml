
- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceDarkElf
  name: DarkElf appearance
  categories: [ HideSpawnMenu ]
  components:
  - type: InitialBody
    organs:
      Torso: OrganDarkElfTorso
      Head: OrganDarkElfHead
      ArmLeft: OrganDarkElfArmLeft
      ArmRight: OrganDarkElfArmRight
      HandLeft: OrganDarkElfHandLeft
      HandRight: OrganDarkElfHandRight
      LegLeft: OrganDarkElfLegLeft
      LegRight: OrganDarkElfLegRight
      FootLeft: OrganDarkElfFootLeft
      FootRight: OrganDarkElfFootRight
      Eyes: OrganDarkElfEyes
      Brain: OrganHumanBrain
      Tongue: OrganHumanTongue
      Appendix: OrganHumanAppendix
      Ears: OrganHumanEars
      Lungs: OrganHumanLungs
      Heart: OrganHumanHeart
      Stomach: OrganHumanStomach
      Liver: OrganHumanLiver
      Kidneys: OrganHumanKidneys
  - type: HumanoidProfile
    species: DarkElf

- type: entity
  parent: [ AppearanceDarkElf, BaseSpeciesMobOrganic ]
  id: MobDarkElf
  name: DarkElf
  components:
  - type: Butcherable
    spawned:
    - id: FoodMeatHuman
      amount: 5
    - id: MaterialBones1
      amount: 3

- type: entity
  parent: OrganHumanExternal
  id: OrganDarkElfExternal
  abstract: true
  components:
  - type: Sprite
    sprite: _Amberfall/Mobs/DarkElf/parts.rsi
  - type: VisualOrgan
    data:
      sprite: _Amberfall/Mobs/DarkElf/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: DarkElf

- type: entity
  parent: [ OrganBaseTorsoSexed, OrganBaseTorso, OrganDarkElfExternal ]
  id: OrganDarkElfTorso

- type: entity
  parent: [ OrganBaseHeadSexed, OrganBaseHead, OrganDarkElfExternal ]
  id: OrganDarkElfHead
  components:
  - type: VisualOrganMarkings
    layerOffsets:
      Hair: 0, 0
      FacialHair: 0, 0
      HeadSide: 0, 0
      HeadTop: 0, 0
      Snout: 0, 0
      SnoutCover: 0, 0
    femaleLayerOffsets:
      Hair: 0, -0.03125
      FacialHair: 0, -0.03125
      HeadSide: 0, -0.03125
      HeadTop: 0, -0.03125
      Snout: 0, -0.03125
      SnoutCover: 0, -0.03125
    hideableLayers:
    - enum.HumanoidVisualLayers.Hair
    - enum.HumanoidVisualLayers.FacialHair
    - enum.HumanoidVisualLayers.HeadSide
    - enum.HumanoidVisualLayers.HeadTop
    - enum.HumanoidVisualLayers.Snout
    - enum.HumanoidVisualLayers.SnoutCover

