
- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceWoodElf
  name: WoodElf appearance
  categories: [ HideSpawnMenu ]
  components:
  - type: InitialBody
    organs:
      Torso: OrganWoodElfTorso
      Head: OrganWoodElfHead
      ArmLeft: OrganWoodElfArmLeft
      ArmRight: OrganWoodElfArmRight
      HandLeft: OrganWoodElfHandLeft
      HandRight: OrganWoodElfHandRight
      LegLeft: OrganWoodElfLegLeft
      LegRight: OrganWoodElfLegRight
      FootLeft: OrganWoodElfFootLeft
      FootRight: OrganWoodElfFootRight
      Eyes: OrganWoodElfEyes
      Brain: OrganHumanBrain
      Tongue: OrganHumanTongue
      Appendix: OrganHumanAppendix
      Ears: OrganHumanEars
      Lungs: OrganHumanLungs
      Heart: OrganHumanHeart
      Stomach: OrganHumanStomach
      Liver: OrganHumanLiver
      Kidneys: OrganHumanKidneys
  - type: HumanoidProfile
    species: WoodElf

- type: entity
  parent: [ AppearanceWoodElf, BaseSpeciesMobOrganic ]
  id: MobWoodElf
  name: WoodElf
  components:
  - type: Butcherable
    spawned:
    - id: FoodMeatHuman
      amount: 5
    - id: MaterialBones1
      amount: 3

- type: entity
  parent: OrganHumanExternal
  id: OrganWoodElfExternal
  abstract: true
  components:
  - type: Sprite
    sprite: _Amberfall/Mobs/WoodElf/parts.rsi
  - type: VisualOrgan
    data:
      sprite: _Amberfall/Mobs/WoodElf/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: WoodElf

- type: entity
  parent: [ OrganBaseTorsoSexed, OrganBaseTorso, OrganWoodElfExternal ]
  id: OrganWoodElfTorso

- type: entity
  parent: [ OrganBaseHeadSexed, OrganBaseHead, OrganWoodElfExternal ]
  id: OrganWoodElfHead
  components:
  - type: VisualOrganMarkings
    layerOffsets:
      Hair: 0, 0.03125
      FacialHair: 0, 0.03125
      HeadSide: 0, 0.03125
      HeadTop: 0, 0.03125
      Snout: 0, 0.03125
      SnoutCover: 0, 0.03125
    femaleLayerOffsets:
      Hair: 0, -0.03125
      FacialHair: 0, -0.03125
      HeadSide: 0, -0.03125
      HeadTop: 0, -0.03125
      Snout: 0, -0.03125
      SnoutCover: 0, -0.03125
    hideableLayers:
    - enum.HumanoidVisualLayers.Hair
    - enum.HumanoidVisualLayers.FacialHair
    - enum.HumanoidVisualLayers.HeadSide
    - enum.HumanoidVisualLayers.HeadTop
    - enum.HumanoidVisualLayers.Snout
    - enum.HumanoidVisualLayers.SnoutCover

