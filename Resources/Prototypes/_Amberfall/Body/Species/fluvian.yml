
- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceFluvian
  name: Fluvian appearance
  categories: [ HideSpawnMenu ]
  components:
  - type: InitialBody
    organs:
      Torso: OrganFluvianTorso
      Head: OrganFluvianHead
      ArmLeft: OrganFluvianArmLeft
      ArmRight: OrganFluvianArmRight
      HandLeft: OrganFluvianHandLeft
      HandRight: OrganFluvianHandRight
      LegLeft: OrganFluvianLegLeft
      LegRight: OrganFluvianLegRight
      FootLeft: OrganFluvianFootLeft
      FootRight: OrganFluvianFootRight
      Tail: OrganFluvianTail
      Wings: OrganFluvianWings
      Eyes: OrganFluvianEyes
      Brain: OrganHumanBrain
      Tongue: OrganHumanTongue
      Appendix: OrganHumanAppendix
      Ears: OrganHumanEars
      Lungs: OrganHumanLungs
      Heart: OrganHumanHeart
      Stomach: OrganHumanStomach
      Liver: OrganHumanLiver
      Kidneys: OrganHumanKidneys
  - type: HumanoidProfile
    species: Fluvian

- type: entity
  parent: [ AppearanceFluvian, BaseSpeciesMobOrganic ]
  id: MobFluvian
  name: Fluvian
  components:
  - type: Butcherable
    spawned:
    - id: FoodMeatHuman
      amount: 5
    - id: MaterialBones1
      amount: 3

- type: entity
  parent: OrganHumanExternal
  id: OrganFluvianExternal
  abstract: true
  components:
  - type: Sprite
    sprite: _Amberfall/Mobs/Fluvian/parts.rsi
  - type: VisualOrgan
    data:
      sprite: _Amberfall/Mobs/Fluvian/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: Fluvian

- type: entity
  parent: [ OrganBaseTorsoSexed, OrganBaseTorso, OrganFluvianExternal ]
  id: OrganFluvianTorso
  components:
  - type: BodyPart
    slots: [ Head, ArmLeft, ArmRight, LegLeft, LegRight, Appendix, Lungs, Heart, Stomach, Liver, Kidneys, Tail, Wings ]

- type: entity
  parent: [ OrganBaseHeadSexed, OrganBaseHead, OrganFluvianExternal ]
  id: OrganFluvianHead
  components:
  - type: VisualOrganMarkings
    layerOffsets:
      Hair: 0, 0.03125
      FacialHair: 0, 0
      HeadSide: 0, 0
      HeadTop: 0, 0
      Snout: 0, 0
      SnoutCover: 0, 0.03125
    femaleLayerOffsets:
      Hair: 0, -0.03125
      FacialHair: 0, -0.03125
      HeadSide: 0, -0.03125
      HeadTop: 0, -0.03125
      Snout: 0, -0.03125
      SnoutCover: 0, -0.03125
    hideableLayers:
    - enum.HumanoidVisualLayers.Hair
    - enum.HumanoidVisualLayers.FacialHair
    - enum.HumanoidVisualLayers.HeadSide
    - enum.HumanoidVisualLayers.HeadTop
    - enum.HumanoidVisualLayers.Snout
    - enum.HumanoidVisualLayers.SnoutCover

- type: entity
  parent: [ OrganBaseArmLeft, OrganFluvianExternal ]
  id: OrganFluvianArmLeft
  components:
