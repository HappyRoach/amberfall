- type: entity
  parent: [ OrganBaseHeadSexed, OrganBaseHead, OrganGoblinExternal ]
  id: OrganGoblinHead
  components:
  - type: VisualOrganMarkings
    layerOffsets:
      Hair: 0, -0.125
      FacialHair: 0, -0.15625
      HeadSide: 0, -0.15625
      HeadTop: 0, -0.15625
      Snout: 0, -0.15625
      SnoutCover: 0, -0.125
    femaleLayerOffsets:
      Hair: 0, -0.15625
      FacialHair: 0, -0.15625
      HeadSide: 0, -0.15625
      HeadTop: 0, -0.15625
      Snout: 0, -0.15625
      SnoutCover: 0, -0.15625
