
- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceTiefling
  name: Tiefling appearance
  categories: [ HideSpawnMenu ]
  components:
  - type: InitialBody
    organs:
      Torso: OrganTieflingTorso
      Head: OrganTieflingHead
      ArmLeft: OrganTieflingArmLeft
      ArmRight: OrganTieflingArmRight
      HandLeft: OrganTieflingHandLeft
      HandRight: OrganTieflingHandRight
      LegLeft: OrganTieflingLegLeft
      LegRight: OrganTieflingLegRight
      FootLeft: OrganTieflingFootLeft
      FootRight: OrganTieflingFootRight
      Tail: OrganTieflingTail
      Eyes: OrganTieflingEyes
      Brain: OrganHumanBrain
      Tongue: OrganHumanTongue
      Appendix: OrganHumanAppendix
      Ears: OrganHumanEars
      Lungs: OrganHumanLungs
      Heart: OrganHumanHeart
      Stomach: OrganHumanStomach
      Liver: OrganHumanLiver
      Kidneys: OrganHumanKidneys
  - type: HumanoidProfile
    species: Tiefling

- type: entity
  parent: [ AppearanceTiefling, BaseSpeciesMobOrganic ]
  id: MobTiefling
  name: Tiefling
  components:
  - type: Butcherable
    spawned:
    - id: FoodMeatHuman
      amount: 5
    - id: MaterialBones1
      amount: 3

- type: entity
  parent: OrganHumanExternal
  id: OrganTieflingExternal
  abstract: true
  components:
  - type: Sprite
    sprite: _Amberfall/Mobs/Tiefling/parts.rsi
  - type: VisualOrgan
    data:
      sprite: _Amberfall/Mobs/Tiefling/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: Tiefling

- type: entity
  parent: [ OrganBaseTorsoSexed, OrganBaseTorso, OrganTieflingExternal ]
  id: OrganTieflingTorso
  components:
  - type: BodyPart
    slots: [ Head, ArmLeft, ArmRight, LegLeft, LegRight, Appendix, Lungs, Heart, Stomach, Liver, Kidneys, Tail ]

- type: entity
  parent: [ OrganBaseHeadSexed, OrganBaseHead, OrganTieflingExternal ]
  id: OrganTieflingHead
  components:
  - type: VisualOrganMarkings
    layerOffsets:
      Hair: 0, 0.03125
      FacialHair: 0, 0.03125
      HeadSide: 0, 0.03125
      HeadTop: 0, 0.03125
      Snout: 0, 0.03125
      SnoutCover: 0, 0.03125
    femaleLayerOffsets:
      Hair: 0, -0.03125
      FacialHair: 0, -0.03125
      HeadSide: 0, -0.03125
      HeadTop: 0, -0.03125
      Snout: 0, -0.03125
      SnoutCover: 0, -0.03125
    hideableLayers:
    - enum.HumanoidVisualLayers.Hair
    - enum.HumanoidVisualLayers.FacialHair
    - enum.HumanoidVisualLayers.HeadSide
    - enum.HumanoidVisualLayers.HeadTop
    - enum.HumanoidVisualLayers.Snout
    - enum.HumanoidVisualLayers.SnoutCover

- type: entity
  parent: [ OrganBaseArmLeft, OrganTieflingExternal ]
  id: OrganTieflingArmLeft
  components:
  - type: VisualOrgan
    sexStateOverrides:
      Male: l_arm
      Female: l_arm_f

- type: entity
  parent: [ OrganBaseArmRight, OrganTieflingExternal ]
  id: OrganTieflingArmRight
  components:
  - type: VisualOrgan
    sexStateOverrides:
      Male: r_arm
      Female: r_arm_f

- type: entity
  parent: [ OrganBaseHandLeft, OrganTieflingExternal ]
  id: OrganTieflingHandLeft
  components:
  - type: VisualOrgan
    sexStateOverrides:
      Male: l_hand
      Female: l_hand_f

- type: entity
  parent: [ OrganBaseHandRight, OrganTieflingExternal ]
  id: OrganTieflingHandRight
  components:
  - type: VisualOrgan
    sexStateOverrides:
      Male: r_hand
      Female: r_hand_f

- type: entity
  parent: [ OrganBaseLegLeft, OrganTieflingExternal ]
  id: OrganTieflingLegLeft
  components:
  - type: VisualOrgan
    sexStateOverrides:
      Male: l_leg
      Female: l_leg_f

- type: entity
  parent: [ OrganBaseLegRight, OrganTieflingExternal ]
  id: OrganTieflingLegRight
  components:
  - type: VisualOrgan
    sexStateOverrides:
      Male: r_leg
      Female: r_leg_f
    overlayLayer: rLegAbove
    overlayState: r_leg_above
    overlaySexStateOverrides:
      Female: r_leg_above_f

- type: entity
  parent: [ OrganBaseFootLeft, OrganTieflingExternal ]
  id: OrganTieflingFootLeft
  components:
  - type: VisualOrgan
    sexStateOverrides:
      Male: l_foot
      Female: l_foot_f

- type: entity
  parent: [ OrganBaseFootRight, OrganTieflingExternal ]
  id: OrganTieflingFootRight
  components:
  - type: VisualOrgan
    sexStateOverrides:
      Male: r_foot
      Female: r_foot_f

- type: entity
  parent: [ OrganBaseTail, OrganTieflingExternal ]
  id: OrganTieflingTail
  components:
  - type: VisualOrganMarkings
    layerOffsets:
      Tail: 0, 0.03125
    femaleLayerOffsets:
      Tail: 0, -0.03125
    hideableLayers: [ enum.HumanoidVisualLayers.Tail ]

- type: entity
  parent: OrganHumanEyes
  id: OrganTieflingEyes
  components:
  - type: VisualOrgan
    data:
      sprite: _Amberfall/Mobs/Tiefling/eyes.rsi
    sexStateOverrides:
      Male: eyes
      Female: eyes_f
