- type: entity
  parent: ClothingOuterBase
  id: ClothingOuterLeathertunic
  components:
  - type: Sprite
    sprite: _Amberfall/Clothing/OuterClothing/Armor/leathertunic.rsi
    state: icon
  - type: Item
    sprite: _Amberfall/Clothing/OuterClothing/Armor/leathertunic.rsi
  - type: Clothing
    sprite: _Amberfall/Clothing/OuterClothing/Armor/leathertunic.rsi
