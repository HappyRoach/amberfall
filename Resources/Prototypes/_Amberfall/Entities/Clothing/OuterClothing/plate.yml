- type: entity
  parent: ClothingOuterBase
  id: ClothingOuterLeathercoat
  components:
  - type: Sprite
    sprite: _Amberfall/Clothing/OuterClothing/Armor/leathercoat.rsi
    state: icon
  - type: Item
    sprite: _Amberfall/Clothing/OuterClothing/Armor/leathercoat.rsi
  - type: Clothing
    sprite: _Amberfall/Clothing/OuterClothing/Armor/leathercoat.rsi
    bodyProfile: true
    wornLayer: armorBody
    sleeveSprite: _Amberfall/Clothing/OuterClothing/Armor/leathercoat_sleeves.rsi
    sleeveState: equipped-SLEEVES
    sleeveLayer: armorSleeves
  - type: Armor
    coverage: [ Torso ]
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.8
        Piercing: 0.9

